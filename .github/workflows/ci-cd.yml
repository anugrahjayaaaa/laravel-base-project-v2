name: CI/CD

# ═══════════════════════════════════════════════════════════════════════════
# WHICH BRANCH MAY DEPLOY?
#
# The `test` job runs on every push and every pull request, whatever the
# branch. Only the `deploy` job is restricted, by the `if:` inside it.
#
# To deploy on a different branch, edit that one `if:` line — see the comment
# block above `deploy:` below for the exact lines to change.
# ═══════════════════════════════════════════════════════════════════════════
on:
  # No `branches:` filter on purpose: test must run on every branch.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel in flight: the deploy job's rsync is followed by a remote
  # migrate, and a cancelled run leaves a half-synced release behind.
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    # Without this the default is 6 hours. A hung `npm ci` or a network stall
    # burns a runner for the whole window instead of failing fast.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # pint --dirty diffs against the merge base. With the default depth-1
          # there is no base ref, so --dirty silently checks nothing and passes
          # without formatting a single file.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, pdo_mysql, sqlite3
          coverage: none
          tools: composer:v2
          # Composer ships its own caching in setup-php, keyed on composer.lock.
          # Skipped an explicit actions/cache step: same saving, one fewer
          # moving part to invalidate by hand.

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # npm cache is already wired through package-lock.json above.

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Node dependencies
        run: npm ci

      # `uses: docker://…` with `args:` passes the string straight to the
      # entrypoint, with no shell — so `*.yml` is never expanded and actionlint
      # dies with "no such file or directory". It also rejects a directory.
      # Running docker ourselves means the runner shell does the globbing, and
      # any new workflow file is picked up without editing this line.
      #
      # There is no rhysd/actionlint-action repository — the published image is
      # the only distribution channel.
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/w" -w /w rhysd/actionlint:1.7.12 .github/workflows/*.yml

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test --no-coverage

      - name: Check changed PHP formatting
        run: vendor/bin/pint --test --dirty

      - name: Composer security audit
        run: composer audit --locked

      - name: NPM security audit
        # Default is "low", which fails the build on any advisory at all — a
        # single transitive dev dependency can block every deploy. Match the
        # composer audit above: only high/critical stops a release.
        run: npm audit --audit-level=high

  # ══════════════════════════════════════════════════════════════════════════
  # DEPLOY JOB BEGINS HERE
  #
  # TO DEPLOY ONLY ON A MERGE TO main (the default, current state):
  #     if: github.ref == 'refs/heads/main'
  #
  # TO DEPLOY ONLY ON A FIXED BRANCH — e.g. to skip pull requests while
  # working directly on a setup branch. Comment the `if:` line above and
  # uncomment this one. The branch must exist on the remote:
  #   # if: github.ref == 'refs/heads/deployment/deployment-setup'
  #
  # TO DEPLOY FROM SEVERAL BRANCHES:
  #   # if: contains(fromJSON('["main", "staging"]'), github.ref_name)
  #
  # TO STOP DEPLOYING ENTIRELY — keep the test job, skip every release.
  # GitHub rejects a constant `if: false`, so the real way to switch the
  # deploy off is to comment out the whole deploy job: everything from
  # `deploy:` down to the end of this file. `test` is unaffected.
  #
  # NEVER delete the `if:` line itself. Without it the job becomes
  # unconditional and every push to any branch ships to the VM.
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Ubuntu VM
    needs: test

    # if: github.ref == 'refs/heads/main'
    if: github.ref == 'refs/heads/deployment/deployment-setup'
    # if: contains(fromJSON('["main", "staging"]'), github.ref_name)
    # if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    environment: Laravel Base Project V2 - Google Cloud
    # Every sudo call below is `sudo -n` and fails fast, but rsync and mysqldump
    # can still stall on a network. 45 covers a normal deploy with room to spare.
    timeout-minutes: 45

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # public/build is gitignored, so a checkout never contains it. Each job
      # gets its own runner, so the test job's build is not visible here —
      # rebuilding is ~30s and avoids upload/download plus artifact expiry.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%b\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%b\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Test SSH
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'echo SSH_OK'

      - name: Test SSH and remote prerequisites
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test -f "'"${DEPLOY_PATH}"'/.env" && command -v rsync && rsync --version | head -n 1'

      # .git is excluded from the deploy rsync, so the VM has no history to
      # restore from. The snapshot has to be taken ON THE VM — the runner only
      # has a checkout of the new code, so tar-ing there would archive the very
      # release a rollback needs to replace.
      #
      # The script is piped in rather than run from the checkout, because the
      # release on the VM may predate it.
      - name: Snapshot the current release
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat > /tmp/deploy-rollback.sh && chmod +x /tmp/deploy-rollback.sh && cd "'"${DEPLOY_PATH}"' && /tmp/deploy-rollback.sh snapshot && rm -f /tmp/deploy-rollback.sh' \
            < bin/deploy-rollback.sh

      - name: Sync application files
        run: |
          rsync -az --delete-delay \
            --rsh="ssh -p ${DEPLOY_PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/storage/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify synced assets
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'test -f "'"${DEPLOY_PATH}"'/public/vendor/theme.css" \
             || { echo "::error::public/vendor missing after rsync — a non-anchored --exclude deleted it"; exit 1; }'

      - name: Deploy application
        run: |
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "${DEPLOY_PATH}" <<'REMOTE'
          set -Eeuo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"

          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
          # supervisor writes to storage/logs/*.log and the backup below lands in
          # storage/db-backups. storage/ is excluded from rsync, so on a fresh VM
          # these directories simply do not exist and supervisor goes FATAL on a
          # missing logfile rather than on anything to do with the app.
          mkdir -p storage/logs storage/db-backups
          # `command=` in the supervisor conf has no `sh` prefix, so this script is
          # exec'd directly and a missing executable bit means permission denied.
          chmod +x bin/run-workers.sh
          chmod -R u+rwX,g+rwX storage bootstrap/cache

          composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader
          php artisan optimize:clear

          # Dump before migrate: a release that migrates and then turns out to
          # be broken has no way back otherwise. Credentials are read from .env
          # and never echoed. Failure is non-fatal — Cloud SQL may not ship a
          # client, and a missing backup should not block the deploy.
          if command -v mysqldump >/dev/null 2>&1; then
              db_env() { grep -E "^$1=" .env | head -n1 | cut -d= -f2- | tr -d '"'"'"''; }
              mkdir -p storage/db-backups
              # Keep the last 5 dumps; without this they accumulate forever.
              ls -1t storage/db-backups/*.sql 2>/dev/null | tail -n +6 | xargs -r rm -f
              MYSQL_PWD="$(db_env DB_PASSWORD)" mysqldump \
                  --host="$(db_env DB_HOST)" --port="$(db_env DB_PORT)" \
                  --user="$(db_env DB_USERNAME)" \
                  --single-transaction --no-tablespaces \
                  "$(db_env DB_DATABASE)" \
                  > "storage/db-backups/$(date -u +%Y%m%d-%H%M%S).sql" \
                  && echo "db backup written" \
                  || echo "::warning::db backup failed, continuing"
          else
              echo "::warning::mysqldump not installed, skipping db backup"
          fi

          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart

          # Opcache keeps serving the previous release's compiled views/blade
          # until php-fpm is reloaded, which makes a successful deploy look
          # like a no-op in the browser.
          for svc in "php$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')-fpm" php-fpm php-fpm8.3; do
            if command -v sudo >/dev/null && sudo -n systemctl cat "$svc" >/dev/null 2>&1; then
                sudo -n systemctl reload "$svc" && echo "reloaded $svc"
                break
            fi
          done
          REMOTE

      # Runs before the health check: a deploy that leaves the workers down is
      # not a finished deploy. Program definitions are installed from the repo
      # so a change to them ships with the release, not via a manual VM edit.
      - name: Install supervisor program definitions
        run: |
          # Same host-key options as every other step in this job. Without them
          # this step is the one place a changed host key would slip through
          # silently, and a deploy is exactly when that matters most.
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "${DEPLOY_PATH}" <<'REMOTE'
          set -Eeuo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"

          command -v supervisorctl >/dev/null || { echo "::error::supervisorctl is not installed on the VM"; exit 1; }

          sudo -n install -d -m 755 /etc/supervisor/conf.d
          sudo -n sed -e "s#__APP_PATH__#${APP_PATH}#g" \
                   -e "s#__PHP_BIN__#/usr/bin/php#g" \
                   deploy/supervisor/laravel-base-project.conf \
                   | sudo -n tee /etc/supervisor/conf.d/laravel-base-project.conf > /dev/null
          sudo -n chmod 644 /etc/supervisor/conf.d/laravel-base-project.conf

          # reread picks up new or changed program blocks; update applies them.
          sudo -n supervisorctl reread
          sudo -n supervisorctl update

          # `queue:restart` in the previous step only signals live workers to
          # exit. A worker that was already dead stays dead — this restart is
          # what actually guarantees both programs are RUNNING.
          sudo -n supervisorctl restart 'laravel-v2-worker:*' || true
          sudo -n supervisorctl restart 'laravel-v2-scheduler:*' || true

          status=$(sudo -n supervisorctl status 'laravel-v2-worker:*' 'laravel-v2-scheduler:*')
          echo "$status"
          if echo "$status" | grep -qv RUNNING; then
              echo "::error::a worker is not RUNNING after deploy"
              exit 1
          fi
          REMOTE

      - name: Health check
        run: |
          # A failed health check leaves a broken release live, so the rollback
          # runs on any failure and only then reports the failure. `exit 1` at
          # the end keeps the workflow red even when the rollback succeeded.
          # Runs at most once: the second curl is a symptom of the same broken
          # release, and restoring twice would just restore the same snapshot.
          rollback() {
            [ "$rolled_back" = "1" ] && return 0
            rolled_back=1
            echo "::error::health check failed, restoring the previous release"
            ssh -p "${DEPLOY_PORT}" \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'cat > /tmp/deploy-rollback.sh && chmod +x /tmp/deploy-rollback.sh && cd "'"${DEPLOY_PATH}"' && /tmp/deploy-rollback.sh restore; rc=$?; rm -f /tmp/deploy-rollback.sh; exit $rc' \
              < bin/deploy-rollback.sh || echo "::error::automatic rollback failed, fix the VM by hand"
          }

          status=0
          rolled_back=0
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            "${DEPLOY_URL}/up" || { rollback; status=1; }
          # The regression this guards: layout links public/vendor/theme.css,
          # so a 404 here means the page renders unstyled even though /up is 200.
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            -o /dev/null \
            "${DEPLOY_URL}/vendor/theme.css" || { rollback; status=1; }
          exit "$status"
