; Supervisor program definitions for laravel-base-project-v2.
;
; Installed by .github/workflows/cd.yml, which substitutes __APP_PATH__ and
; __PHP_BIN__ before copying this into /etc/supervisor/conf.d/. The placeholders
; live here so the deploy path stays a single source of truth (the GH secret)
; instead of being hardcoded in two places.
;
; Both programs exec bin/run-workers.sh, so the queue flags stay in one script.

[program:laravel-v2-worker]
process_name=%(program_name)s_%(process_num)02d
command=__APP_PATH__/bin/run-workers.sh queue
directory=__APP_PATH__
autostart=true
autorestart=true
; Give a job QUEUE_TIMEOUT (default 90s) to finish before SIGKILL.
; This must stay BELOW stopwaitsecs, and stopwaitsecs must stay BELOW
; retry_after on the same connection:
;
;   QUEUE_TIMEOUT (90)  <  stopwaitsecs (120)  <  DB/REDIS_QUEUE_RETRY_AFTER (180)
;
; On both drivers a running job whose reservation expires is picked up again by
; the next worker and runs twice (the database driver re-selects rows whose
; `reserved_at` is older than retry_after — it does not hold the row for the
; whole run). Raise the retry window whenever the worker timeout is raised.
stopwaitsecs=120
stopasgroup=true
killasgroup=true
; A crashed worker restarting instantly in a tight loop fills the log and
; masks the real error; startretries gives up and leaves it visibly FATAL.
startretries=3
stdout_logfile=__APP_PATH__/storage/logs/worker.log
stderr_logfile=__APP_PATH__/storage/logs/worker-error.log
redirect_stderr=false
environment=APP_ENV="production",APP_DEBUG="false"

; Backups run on their own connection (`backups`, config/queue.php) because
; they legitimately take up to 30 minutes while every other job finishes in
; seconds. Same chain, scaled to the job:
;
;   BACKUP_QUEUE_TIMEOUT (1800)  <  stopwaitsecs (1900)  <  BACKUP_QUEUE_RETRY_AFTER (2000)
;
; Without this process the `backups` queue is never consumed — the scheduler
; and the manual trigger would both enqueue into a queue nobody reads.
[program:laravel-v2-backup-worker]
process_name=%(program_name)s_%(process_num)02d
command=__APP_PATH__/bin/run-workers.sh backups
directory=__APP_PATH__
autostart=true
autorestart=true
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
startretries=3
stdout_logfile=__APP_PATH__/storage/logs/backup-worker.log
stderr_logfile=__APP_PATH__/storage/logs/backup-worker-error.log
redirect_stderr=false
environment=APP_ENV="production",APP_DEBUG="false"

[program:laravel-v2-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=__APP_PATH__/bin/run-workers.sh scheduler
directory=__APP_PATH__
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
startretries=3
stdout_logfile=__APP_PATH__/storage/logs/scheduler.log
stderr_logfile=__APP_PATH__/storage/logs/scheduler-error.log
redirect_stderr=false
environment=APP_ENV="production",APP_DEBUG="false"
