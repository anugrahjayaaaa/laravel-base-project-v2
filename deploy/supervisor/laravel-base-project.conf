; Supervisor program definitions for laravel-base-project-v2.
;
; Installed by .github/workflows/cd.yml, which substitutes __APP_PATH__ and
; __PHP_BIN__ before copying this into /etc/supervisor/conf.d/. The placeholders
; live here so the deploy path stays a single source of truth (the GH secret)
; instead of being hardcoded in two places.
;
; Both programs exec bin/run-workers.sh, so the queue flags stay in one script.

[program:laravel-v2-worker]
process_name=%(program_name)s_%(process_num)02d
command=__APP_PATH__/bin/run-workers.sh queue
directory=__APP_PATH__
autostart=true
autorestart=true
; Give a job QUEUE_TIMEOUT (default 90s) to finish before SIGKILL.
stopwaitsecs=120
stopasgroup=true
killasgroup=true
; A crashed worker restarting instantly in a tight loop fills the log and
; masks the real error; startretries gives up and leaves it visibly FATAL.
startretries=3
stdout_logfile=__APP_PATH__/storage/logs/worker.log
stderr_logfile=__APP_PATH__/storage/logs/worker-error.log
redirect_stderr=false
environment=APP_ENV="production",APP_DEBUG="false"

[program:laravel-v2-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=__APP_PATH__/bin/run-workers.sh scheduler
directory=__APP_PATH__
autostart=true
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
startretries=3
stdout_logfile=__APP_PATH__/storage/logs/scheduler.log
stderr_logfile=__APP_PATH__/storage/logs/scheduler-error.log
redirect_stderr=false
environment=APP_ENV="production",APP_DEBUG="false"
